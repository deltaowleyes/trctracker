name: Build site
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tools/**'
      - 'site.config.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check
        run: |
          python3 tools/build.py
          python3 tools/check_links.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html news scripts 404.html feed.xml sitemap.xml
          if git diff --cached --quiet; then echo "Pages already up to date."; exit 0; fi
          git commit -m "Rebuild pages"
          git push
